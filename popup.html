<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JunkBlade Speed</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1>JunkBlade<br><span>Animation Speed</span></h1>
    <p id="site-status" class="status">対象サイトを確認中です。</p>
    <label for="speed">再生倍率</label>
    <div class="speed-row">
      <input id="speed" type="range" min="1" max="16" step="1" value="4" aria-describedby="speed-value">
      <output id="speed-value" for="speed">4x</output>
    </div>
    <div class="presets" aria-label="倍率のプリセット">
      <button type="button" data-speed="1">1x</button>
      <button type="button" data-speed="2">2x</button>
      <button type="button" data-speed="4">4x</button>
      <button type="button" data-speed="8">8x</button>
      <button type="button" data-speed="16">16x</button>
    </div>
    <button id="apply" type="button" class="apply">この倍率を適用</button>
    <p id="result" class="result" aria-live="polite"></p>
    <p class="note">適用後に始める操作から高速化されます。推奨は 4x です。</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
